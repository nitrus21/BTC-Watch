name: Déployer le Web Flasher sur GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "webflasher/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer le Web Flasher
        uses: actions/upload-pages-artifact@v3
        with:
          path: webflasher

      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
